name: numerical-causality-diagnosis
on:
  push:
    branches: [diagnose/numerical-causality]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.12'
      - run: uv sync --locked --python 3.12
      - name: Trace and isolate upstream inputs without altering model files
        run: uv run --offline python diagnostics/causal_probe.py --reference diagnostics/macos-reference.json --output artifacts/causality
      - name: Compare NumPy dispatch with optional SIMD disabled
        env:
          NPY_DISABLE_CPU_FEATURES: AVX512F,AVX2,FMA3
        run: uv run --offline python diagnostics/causal_probe.py --primitives-only --output artifacts/without-simd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-causality-evidence
          path: artifacts/
          retention-days: 30
