name: numerical-causality-diagnosis
on:
  push:
    branches: [diagnose/numerical-causality]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.12'
      - run: uv sync --locked --python 3.12
      - name: Capture native power dispatch
        run: uv run --offline python diagnostics/causal_probe.py --primitives-only --output artifacts/native
      - name: Compare NumPy dispatch with optional SIMD disabled
        env:
          NPY_DISABLE_CPU_FEATURES: X86_V3,X86_V4,AVX512_ICL,AVX512_SPR
        run: uv run --offline python diagnostics/causal_probe.py --primitives-only --output artifacts/without-simd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-causality-evidence
          path: artifacts/
          retention-days: 30
