name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.12'
      - name: Verify production installation and entrypoint
        run: |
          uv sync --locked --no-dev --python 3.12
          .venv/bin/python scripts/smoke_app.py
      - name: Install locked environment
        run: uv sync --locked --python 3.12
      - name: Check exported requirements
        run: |
          uv export --locked --offline --no-header --no-dev --no-emit-project --format requirements-txt --output-file "${RUNNER_TEMP}/compute-requirements.txt"
          diff requirements.txt "${RUNNER_TEMP}/compute-requirements.txt"
      - name: Lint and formatting
        run: |
          uv run --offline ruff check .
          uv run --offline ruff format --check .
      - name: Validate frozen sources and rebuild catalog
        run: |
          mkdir -p artifacts
          uv run --offline compute-economics validate-data
          uv run --offline compute-economics catalog --output artifacts/catalog.duckdb
      - name: Review documentation and repository hygiene
        run: uv run --offline python scripts/review_repository.py
      - name: Unit, integration and Streamlit AppTest
        run: uv run --offline pytest -q
      - name: Verify decision equivalence against the numerical baseline
        run: uv run --offline python scripts/verify_reduction_equivalence.py
      - name: Repeat complete export reproduction five times
        run: |
          for iteration in 1 2 3 4 5; do
            echo "Reproduction iteration ${iteration}/5"
            uv run --offline python scripts/verify_reproduction.py
          done
      - name: Retain reproduction mismatch evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-failure-evidence
          path: artifacts/reproduction-failures/
          if-no-files-found: ignore
          retention-days: 14
