name: diagnose-linux-reproduction
on:
  push:
    branches: [codex/diagnose-linux-reproduction]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.12'
      - run: uv sync --locked --python 3.12
      - name: Capture original Linux exports and comparisons
        run: uv run --offline python scripts/diagnose_reproduction.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-reproduction-diagnosis
          path: artifacts/diagnosis/
          retention-days: 7
